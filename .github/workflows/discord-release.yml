name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Post to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893" # Dark Blue/Purple (Valis Theme)
          username: "Valis Updates"
          avatar_url: "https://raw.githubusercontent.com/Saga-Src/Valis/main/public/images/logo.png"
          footer_title: "Valis Launcher"
